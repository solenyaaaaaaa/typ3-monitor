name: TYP3 Drop Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# No concurrency block on purpose: GitHub would auto-cancel queued runs when
# the runner pool slows down, producing "No jobs were run" failure emails.
# The git push step retries with rebase, so parallel runs are safe.

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run monitor
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          if git diff --quiet -- state.json; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "state: update [skip ci]"
          # Retry push up to 4 times with rebase, to absorb:
          #  - races with concurrent runs ("fetch first")
          #  - GitHub git-server hiccups (5xx)
          for attempt in 1 2 3 4; do
            if git push 2>&1; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed; rebasing and retrying..."
            git fetch origin main
            git rebase origin/main || { echo "rebase conflict, aborting"; git rebase --abort; }
            sleep $((attempt * 3))
          done
          echo "::warning::failed to push state.json after 4 attempts; will retry on next run"
          # Exit 0 anyway: state will be re-derived on the next run.
          # Real alerts (if any) were already emailed before this step.
          exit 0

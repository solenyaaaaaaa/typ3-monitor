name: TYP3 Drop Monitor

on:
  # Watchdog, not the primary trigger. The loop hands off to the next run as it
  # exits (see .github/scripts/handoff.sh); this exists to restart the chain if
  # a run ever dies without handing off. GitHub deprioritises cron heavily on
  # this repo -- measured 2026-08-28..31, it fired 17 times in 3 days, gaps of
  # 2h to 7.6h -- so it is a recovery mechanism, never the thing you rely on.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit state.json back to main
  actions: write    # dispatch the next loop from handoff.sh

# Exactly one loop at a time.
#
# cancel-in-progress is false on purpose: a watchdog firing mid-loop must not
# kill the live loop. It queues instead, and GitHub starts it the moment the
# running loop exits -- which doubles as a second handoff path. Only *pending*
# runs get superseded, and a superseded run is marked cancelled, not failed, so
# this does not reproduce the "No jobs were run" failure email the old
# concurrency block caused (it used the default cancel-in-progress).
concurrency:
  group: drop-monitor-loop
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Loop runs 5h30m; the rest is headroom for checkout, setup and handoff.
    # GitHub's hard ceiling for a job is 6h.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Poll loop
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          # TEMPORARY: 300s while the handoff chain is being validated, so a
          # broken handoff shows up in minutes instead of 5.5 hours. Raise to
          # 19800 once a few handoffs have been observed.
          LOOP_SECONDS: "300"
          POLL_INTERVAL: "60"
        run: bash .github/scripts/poll_loop.sh

      - name: Hand off to the next loop
        # Runs even if the loop step failed, because a broken loop is exactly
        # when the next one matters most. Skipped on cancellation: a cancelled
        # run means another run is already taking over.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/handoff.sh
